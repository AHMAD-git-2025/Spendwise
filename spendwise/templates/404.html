<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ error_code|default('404') }} — {{ error_title|default('Page Not Found') }} | SpendWise</title>
<meta name="description" content="The requested page could not be found on SpendWise.">

<script>
(function(){
  var dark = false;
  try {
    var t = localStorage.getItem('spendwiseTheme') || localStorage.getItem('spendwise_theme');
    if (!t && localStorage.getItem('sw-dark') === '1') t = 'dark';
    dark = (t === 'dark') || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
  } catch(e) {}
  var r = document.documentElement;
  r.classList.toggle('dark', dark);
  r.setAttribute('data-theme', dark ? 'dark' : 'light');
  r.style.colorScheme = dark ? 'dark' : 'light';
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/ui.css">

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(700px 400px at 15% 0, rgba(20,184,166,.18), transparent 60%), radial-gradient(600px 400px at 100% 100%, rgba(99,102,241,.14), transparent 60%), var(--bg);
  color: var(--ink);
  transition: background .3s;
  position: relative;
}
.err-nav {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(20px, 4.5vw, 48px);
  z-index: 10;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 20px;
  color: var(--ink);
  text-decoration: none;
}
.logo-bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
.logo-bars span { width: 4.5px; border-radius: 2px; display: block; }
.logo-bars span:nth-child(1) { height: 9px; background: #5eead4; }
.logo-bars span:nth-child(2) { height: 15px; background: #14b8a6; }
.logo-bars span:nth-child(3) { height: 20px; background: #0d9488; }
.icon-btn {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--ink);
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all .2s;
}
.icon-btn:hover {
  background: var(--surface-2);
  border-color: var(--teal);
}
.box {
  width: min(560px, 100%);
  text-align: center;
  padding: clamp(32px, 5vw, 48px);
  border-radius: 28px;
  background: color-mix(in srgb, var(--card) 85%, transparent);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  box-shadow: 0 30px 70px rgba(15,23,42,.12);
  animation: pgIn .6s var(--ease-out) both;
  margin-top: 40px;
}
.code-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.code-num {
  font-size: clamp(64px, 16vw, 110px);
  font-weight: 800;
  font-family: 'Plus Jakarta Sans', sans-serif;
  line-height: 1;
  background: linear-gradient(135deg, var(--teal-light), var(--teal-dark) 60%, #6366f1);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -2px;
}
h1 {
  font-size: clamp(20px, 3.5vw, 26px);
  font-weight: 800;
  font-family: 'Plus Jakarta Sans', sans-serif;
  margin: 12px 0 10px;
}
p {
  color: var(--muted);
  font-size: 14.5px;
  line-height: 1.6;
  margin: 0 auto 28px;
  max-width: 440px;
}
.acts {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.links {
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 10px;
}
.links a {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px;
  border-radius: 12px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 600;
  transition: all .2s;
}
.links a:hover {
  background: rgba(20,184,166,.1);
  color: var(--teal);
}
</style>
</head>

<body>
<header class="err-nav">
  <a href="/" class="brand">
    <div class="logo-bars"><span></span><span></span><span></span></div>
    <span class="glitch-logo" data-text="SpendWise">SpendWise</span>
  </a>
  <div class="nav-right">
    <button class="icon-btn" id="themeToggle" aria-label="Toggle dark/light theme" title="Toggle theme">
      <svg class="ic"><use href="#i-moon" /></svg>
    </button>
  </div>
</header>

<main class="box" role="main">
  <div class="code-wrap">
    <div class="code-num glitch-logo" data-text="{{ error_code|default('404') }}">{{ error_code|default('404') }}</div>
  </div>

  <h1>{{ error_title|default('Page Not Found') }}</h1>
  <p>{{ error_message|default('The page you are looking for does not exist, has been moved, or the link you followed is incorrect.') }}</p>

  <div class="acts">
    <a class="btn btn-primary" href="/dashboard">
      <svg class="ic"><use href="#i-home" /></svg>
      <span>Dashboard</span>
    </a>
    <a class="btn btn-secondary" href="/">
      <svg class="ic"><use href="#i-arrow" /></svg>
      <span>Back to Home</span>
    </a>
    <button class="btn btn-secondary" onclick="window.history.back()">
      <span>Go Back</span>
    </button>
  </div>

  <nav class="links" aria-label="Helpful routes">
    <a href="/income"><svg class="ic"><use href="#i-wallet" /></svg> Income</a>
    <a href="/expenses"><svg class="ic"><use href="#i-receipt" /></svg> Expenses</a>
    <a href="/budget"><svg class="ic"><use href="#i-calendar" /></svg> Budget</a>
    <a href="/contact"><svg class="ic"><use href="#i-mail" /></svg> Support</a>
  </nav>
</main>

<script src="/static/js/ui.js"></script>
</body>
</html>
